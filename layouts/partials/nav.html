<nav class="sticky top-0 z-50 border-b border-slate-200 dark:border-navy-800 bg-white/80 dark:bg-navy-950/80 backdrop-blur-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Logo -->
      <a href="/" class="flex items-center gap-3 shrink-0" aria-label="The Agency — home">
        {{ partial "logo.html" (dict "class" "h-10 w-auto" "file" "static/images/logo-wordmark.svg") }}
      </a>

      <!-- Desktop nav -->
      <div class="hidden md:flex items-center gap-6">
        {{ range .Site.Menus.main }}
          <a href="{{ .URL }}" class="text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition-colors">{{ .Name }}</a>
        {{ end }}

        <a href="{{ .Site.Params.github }}" class="text-sm font-medium text-slate-600 dark:text-slate-300 hover:text-slate-900 dark:hover:text-white transition-colors" target="_blank" rel="noopener">GitHub</a>

        {{ partial "theme-toggle.html" . }}
      </div>

      <!-- Mobile menu button -->
      <div class="flex items-center gap-2 md:hidden">
        {{ partial "theme-toggle.html" . }}
        <button type="button" id="mobile-menu-btn" class="p-2 rounded-lg text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 hover:bg-slate-100 dark:hover:bg-navy-800 transition-colors" aria-label="Open menu" aria-controls="mobile-menu" aria-expanded="false">
          <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" /></svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Mobile menu -->
  <div id="mobile-menu" class="hidden md:hidden border-t border-slate-200 dark:border-navy-800 bg-white dark:bg-navy-950">
    <div class="px-4 py-3 space-y-1">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL }}" class="block px-2 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-navy-800 rounded">{{ .Name }}</a>
      {{ end }}
      <div class="border-t border-slate-200 dark:border-navy-800 pt-2 mt-2">
        <a href="{{ .Site.Params.github }}" class="block px-2 py-2 text-sm font-medium text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-navy-800 rounded" target="_blank" rel="noopener">GitHub</a>
      </div>
    </div>
  </div>
</nav>

<script>
(function() {
  var mobileBtn = document.getElementById('mobile-menu-btn');
  var mobileMenu = document.getElementById('mobile-menu');
  if (mobileBtn && mobileMenu) {
    mobileBtn.addEventListener('click', function() {
      var hidden = mobileMenu.classList.toggle('hidden');
      mobileBtn.setAttribute('aria-expanded', hidden ? 'false' : 'true');
    });
  }
})();
</script>
